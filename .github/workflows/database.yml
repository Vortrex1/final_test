name: Database Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  TEST_PROJECT: HotelBooking.Tests/HotelBooking.Tests.csproj

jobs:
  database-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.TEST_PROJECT }}
      
      - name: Build project
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore
      
      - name: Run Database Tests
        run: dotnet test ${{ env.TEST_PROJECT }} --filter "FullyQualifiedName~HotelBooking.Tests.Database" --configuration Release --no-build --logger "trx;LogFileName=database-tests.trx"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: |
            **/TestResults/*.trx
          retention-days: 30
          if-no-files-found: ignore
