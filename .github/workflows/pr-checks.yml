name: PR Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  DOTNET_VERSION: '8.0.x'
  TEST_PROJECT: HotelBooking.Tests/HotelBooking.Tests.csproj

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check PR title
        run: |
          if [[ ! "${{ github.event.pull_request.title }}" =~ ^(feat|fix|docs|style|refactor|perf|test|chore)(\([a-z]+\))?!?: ]]; then
            echo "::warning::PR title does not follow conventional commit format"
          fi
      
      - name: Check for changes
        run: |
          if [ "${{ github.event.pull_request.changed_files }}" -eq 0 ]; then
            echo "No changes detected"
            exit 1
          fi

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - validate-pr
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore NuGet packages
        run: dotnet restore ${{ env.TEST_PROJECT }}
      
      - name: Build project
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore
      
      - name: Run all tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --logger "trx"
      
      - name: Test Results Summary
        if: always()
        run: echo "All tests have been executed. Check the logs above for results."
